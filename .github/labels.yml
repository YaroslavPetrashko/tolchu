# Issue/PR labels. Every issue gets exactly one label from each group:
#   type:     what kind of work it is
#   area:     which part of the product it touches (more than one is fine)
#   priority: how urgent it is, tied to the course deadlines
#
# Sync to GitHub with: bin/github-labels   (requires `gh auth login`)

# --- type ---------------------------------------------------------------
- name: "type: feature"
  color: "1D76DB"
  description: "New user-facing capability"
- name: "type: bug"
  color: "D73A4A"
  description: "Something is broken or behaves incorrectly"
- name: "type: chore"
  color: "C5DEF5"
  description: "Tooling, config, dependencies, CI/CD, infrastructure"
- name: "type: test"
  color: "BFD4F2"
  description: "Test coverage or test infrastructure"
- name: "type: docs"
  color: "0075CA"
  description: "Documentation only"
- name: "type: refactor"
  color: "D4C5F9"
  description: "Code quality change with no behaviour change"
- name: "type: spike"
  color: "FEF2C0"
  description: "Time-boxed research; the deliverable is a written recommendation"

# --- area ---------------------------------------------------------------
- name: "area: frontend"
  color: "7057FF"
  description: "Views, CSS, Stimulus/Turbo, UX"
- name: "area: backend"
  color: "0E8A16"
  description: "Controllers, models, services, jobs"
- name: "area: betting-engine"
  color: "5319E7"
  description: "Parimutuel math, settlement, wallet and ledger"
- name: "area: creator-tools"
  color: "E99695"
  description: "Studio, market creation, creator rewards"
- name: "area: auth"
  color: "F9D0C4"
  description: "Accounts, sessions, passwords"
- name: "area: video"
  color: "FBCA04"
  description: "Clip upload, hosting, playback"
- name: "area: devops"
  color: "BFDADC"
  description: "CI, Heroku, deploys, monitoring"
- name: "area: database"
  color: "C2E0C6"
  description: "Schema, migrations, data"
- name: "area: analytics"
  color: "D876E3"
  description: "Product analytics and metrics"

# --- priority (deadline-based) ------------------------------------------
- name: "priority: P0 · now"
  color: "B60205"
  description: "Blocks the team or the current deadline (Iteration 1, Nov 9). Do first."
- name: "priority: P1 · iteration 2"
  color: "D93F0B"
  description: "Needed for the Iteration 2 submission"
- name: "priority: P2 · final demo"
  color: "FBCA04"
  description: "Needed before the final demo and real-user testing (after Thanksgiving)"
- name: "priority: P3 · backlog"
  color: "EDEDED"
  description: "Nice to have; pick up when the higher priorities are done"
